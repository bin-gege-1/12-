services:
  - type: web
    name: neuro-kb
    runtime: python
    buildCommand: pip install -r webapp/requirements.txt
    startCommand: cd webapp && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
